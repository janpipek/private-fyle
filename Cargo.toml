[package]
name = "fyle"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "5"
globset = "0.4.20"
gpui-kit = { version = "0.7.0", features = ["tree-sitter-languages"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
open = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
toml_edit = "0.25.15"
trash = "5"
