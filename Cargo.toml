[package]
name = "fyle"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "5"
flate2 = "1.1.10"
globset = "0.4.20"
gpui-kit = { version = "0.7.0", features = ["tree-sitter-languages"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send"] }
open = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
toml = "0.9"
toml_edit = "0.25.15"
trash = "5"
zip = { version = "8.6.0", default-features = false }

# Dependencies (gpui, tree-sitter grammars, ...) without debug info keep the
# dev build small and fast to link; fyle's own code keeps it. They are
# optimised because unoptimised gpui makes scrolling and input lag; they
# rarely change, so this costs only the first build.
[profile.dev.package."*"]
debug = false
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
