[package]
name = "fyle"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.22.1"
dirs = "5"
dunce = "1.0.5"
flate2 = "1.1.10"
globset = "0.4.20"
html5ever = "0.27.0"
gpui-kit = { version = "0.7.0", features = ["tree-sitter-languages"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
jiff = "0.2.38"
markdown = "1.0.0"
markup5ever_rcdom = "0.3.0"
kamadak-exif = "0.6.1"
md-5 = "0.10"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send"] }
open = "5"
parquet = { version = "59", default-features = false, features = ["snap", "flate2-zlib-rs", "lz4", "zstd", "brotli"] }
png = "0.18"
remotefs = "1"
remotefs-aws-s3 = { version = "1", features = ["tokio"] }
remotefs-ftp = { version = "1", features = ["rustls-ring"] }
remotefs-ssh = { version = "1", default-features = false, features = ["russh", "find"] }
remotefs-webdav = { version = "1", features = ["tokio"] }
russh = "0.63"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh2-config = "0.8"
tar = "0.4.46"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
toml = "0.9"
toml_edit = "0.25.15"
trash = "5"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
calamine = { version = "0.36.1", default-features = false, features = ["dates"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }

# Dependencies (gpui, tree-sitter grammars, ...) without debug info keep the
# dev build small and fast to link; fyle's own code keeps it. They are
# optimised because unoptimised gpui makes scrolling and input lag; they
# rarely change, so this costs only the first build.
[profile.dev.package."*"]
debug = false
opt-level = 3

# A smaller, faster release binary at the cost of a slower release build.
[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[dev-dependencies]
tempfile = "3.27.0"
