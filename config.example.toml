# fyle settings. Copy to:
#   Linux:   ~/.config/fyle/config.toml   ($XDG_CONFIG_HOME/fyle/config.toml)
#   Windows: %APPDATA%\fyle\config.toml
#   macOS:   ~/Library/Application Support/fyle/config.toml
# Every key is optional; the values below are the defaults.
# Unknown keys are an error (shown in the status line; defaults are used).

show_hidden = false
# "system" (follow OS light/dark), "light", "dark", or a theme name
# (case-insensitive), e.g. "Tokyo Night", "Catppuccin Mocha", "Gruvbox Dark".
# Bundled themes: see themes/README.md. Extra themes: put gpui-component
# theme files (*.json) into the "themes" folder next to this file.
theme = "system"
# UI font size in pixels (8-36). Zoom (Ctrl-+ / Ctrl-- / Ctrl-0, Ctrl-wheel)
# changes and saves it.
font_size = 16.0

# Directories listed first in Go to (Ctrl-G); Ctrl-D adds the current one.
bookmarks = []

# Extra key bindings (they override the defaults). `action` is a command name
# as listed by F1 / Ctrl-P in its code form (Copy, Move, MakeDir, Delete,
# DeletePermanently, Rename, EditFile, TogglePreview, ToggleTree, ToggleHidden,
# Filter, GoTo, AddBookmark, FindFiles, ToolsMenu, SelectTheme, Refresh, Quit,
# ...), or "none" to unbind. `context`: "panel" (default), "global", "editor".
# Programs opening files. Enter uses the first matching rule (else the system
# default); Shift-Enter offers all matching ones. The path is appended to
# `command`, or substituted for "{path}". Match by `exts`, `kinds` (image,
# code, text, audio, video, archive, ...) or `names`.
# [[opener]]
# label = "GIMP"
# command = ["gimp"]
# kinds = ["image"]

# [[keymap]]
# keys = "ctrl-c"
# action = "Copy"

[extensions]
# Package IDs from the config directory's extensions folder. Enabling a package
# permits its declared readers to run automatically; restart after changing.
enabled = []

[window]
width = 1200
height = 760
custom_titlebar = true     # themed title bar; false requests native (restart)

[panels]
# Start directories; "~" expands to the home directory.
# Command-line arguments override these. Defaults: left = current
# directory, right = home directory.
# left = "~/projects"
# right = "~"
tree = false              # start panels in tree mode (list view only)
# How each panel shows its folder: "list" or "icons" (View menu, Ctrl-1 /
# Ctrl-2 switch the active panel and save the choice).
left_view = "list"
right_view = "list"
# Icon size in icon view, in pixels: 48, 64, 96, 128 or 160 (Alt-=
# and Alt-- step through them and save it; both panels share it).
icon_size = 96
# Columns, in order (Columns… in the command palette edits this list):
#   file:       name, ext, size, modified, created
#   media:      duration (local audio and video files)
#   unix:       permissions, owner
#   git:        git.status (runs `git status` per directory)
#   attributes: xattrs, selinux
#   exif:       exif.taken, exif.camera, exif.lens, exif.exposure,
#               exif.aperture, exif.iso, exif.focal_length,
#               exif.dimensions, exif.gps
# Unknown column IDs are preserved and shown as unavailable until registered.
columns = ["name", "ext", "size", "modified"]
sort = "name"             # "name" | "ext" | "size" | "modified"
sort_descending = false

[workspace]
# "two_panels", "two_panels_inspector", or "one_panel_inspector".
layout = "two_panels"

[editor]
# External editor for F4 / Shift-F4, e.g. ["code"]; the file path is appended.
# Empty uses the built-in editor.
command = []

[terminal]
# Terminal for "Open terminal here" (F9), e.g. ["kitty", "-d", "{dir}"];
# {dir} is the panel directory, which is also the working directory.
# Empty: $TERMINAL, else the first known terminal installed (ptyxis,
# gnome-terminal, konsole, kitty, alacritty, wezterm, foot, ghostty, xterm…).
command = []
